<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Notes - Google Keep Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #f1f3f4;
            --note-bg: #fff;
            --header-bg: #fff;
            --border-color: #e0e0e0;
            --shadow: 0 1px 2px 0 rgba(60,64,67,.302), 0 1px 3px 1px rgba(60,64,67,.149);
            --hover-shadow: 0 1px 2px 0 rgba(60,64,67,.302), 0 2px 6px 2px rgba(60,64,67,.149);
            --light-blue: #d2e3fc;
            --light-green: #d4edda;
            --light-yellow: #fff3cd;
            --light-pink: #f8d7da;
        }

        body {
            background-color: var(--primary-color);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--header-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 30px;
        }

        .logo i {
            color: #ff6d00;
            font-size: 28px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 500;
            color: #5f6368;
        }

        .search-container {
            flex: 1;
            max-width: 720px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #f1f3f4;
            font-size: 16px;
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6368;
        }

        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .add-note {
            background-color: var(--note-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 16px;
            cursor: pointer;
            transition: box-shadow 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }

        .add-note:hover {
            box-shadow: var(--hover-shadow);
        }

        .add-note i {
            font-size: 24px;
            color: #5f6368;
            align-self: flex-start;
        }

        .add-note p {
            margin-top: 10px;
            color: #5f6368;
            font-size: 16px;
        }

        .note-card {
            background-color: var(--note-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 16px;
            position: relative;
            transition: box-shadow 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            word-wrap: break-word;
        }

        .note-card:hover {
            box-shadow: var(--hover-shadow);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .note-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #202124;
        }

        .note-content {
            font-size: 14px;
            color: #3c4043;
            line-height: 1.5;
            flex-grow: 1;
            white-space: pre-wrap;
        }

        .note-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 10px;
        }

        .note-actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-card:hover .note-actions {
            opacity: 1;
        }

        .note-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #5f6368;
            font-size: 16px;
            padding: 4px;
            border-radius: 4px;
        }

        .note-actions button:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .color-picker {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-card:hover .color-picker {
            opacity: 1;
        }

        .color-option {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.active {
            border-color: #5f6368;
        }

        .blue { background-color: var(--light-blue); }
        .green { background-color: var(--light-green); }
        .yellow { background-color: var(--light-yellow); }
        .pink { background-color: var(--light-pink); }
        .white { background-color: #fff; }

        .pinned {
            border-left: 3px solid #ff6d00;
        }

        @media (max-width: 768px) {
            .notes-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .logo h1 {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            .search-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-lightbulb"></i>
                <h1>Keep Notes</h1>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="notes-grid">
            <!-- Add Note Card -->
            <div class="add-note" id="add-note-btn">
                <i class="fas fa-plus"></i>
                <p>Take a note...</p>
            </div>
            
            <!-- Notes will be dynamically added here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
